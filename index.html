<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFFFF">
<title>RIT Digital</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#101828; --muted:#596273; --line:#D5DAE2;
  --navy:#1F3864; --on-navy:#FFFFFF; --navy-soft:#E7ECF6; --orange:#E45302; --on-orange:#FFFFFF;
  --danger:#B42318; --danger-soft:#FDECEA; --focus:#2F6FEB;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Siempre en fondo blanco, aunque el teléfono o la app estén en modo oscuro */
html, html[data-theme], :root[data-theme="dark"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#101828; --muted:#596273; --line:#D5DAE2;
  --navy:#1F3864; --on-navy:#FFFFFF; --navy-soft:#E7ECF6; --orange:#E45302; --on-orange:#FFFFFF;
  --danger:#B42318; --danger-soft:#FDECEA; --focus:#2F6FEB; color-scheme: light;
}
html, body{background:#FFFFFF !important}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:400 16px/1.45 "Barlow", Arial, Helvetica, sans-serif; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
h1,h2,h3{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; font-weight:700; margin:0; letter-spacing:.005em}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
img{max-width:100%}

/* Barra superior */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:10px 16px}
.top img{height:24px; width:auto; flex:none}
.top .ttl{min-width:0; flex:1; border-left:1px solid var(--line); padding-left:12px}
.top h1{font-size:17px; line-height:1.12}
.top p{margin:0; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.saved{font-size:12px; color:var(--muted); white-space:nowrap}
.saved:empty{display:none}
:root[data-dark-logo] .top img{filter:none}

main{max-width:760px; margin:0 auto; padding:14px 12px 120px}
section{margin:0 0 14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px}
.sechead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 4px 10px}
.sechead h2, .card > h2{font-size:21px}
.card > h2{margin-bottom:12px}
.count{font:600 15px "Barlow",sans-serif; color:var(--muted); margin-left:6px}
.hint{color:var(--muted); font-size:14px; margin:-6px 0 12px}

/* Campos */
.fld{display:block; margin:0 0 14px}
.fld > span:first-child, .lbl{display:block; font:600 14px "Barlow",sans-serif; color:var(--muted); margin:0 0 6px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
input[type=text],input[type=date],input[type=search],input:not([type]),textarea,.stepper input{
  width:100%; min-height:48px; border:1.5px solid var(--line); background:var(--sunk); border-radius:10px; padding:10px 12px; font-size:16px}
textarea{resize:vertical; min-height:64px}
input:focus,textarea:focus{border-color:var(--navy); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 22%,transparent)}
.seg{display:flex; background:var(--sunk); border:1.5px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg button{flex:1; min-height:44px; border:0; border-radius:9px; background:transparent; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy); color:var(--on-navy)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
.chip{min-height:42px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-weight:600; font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy); color:var(--on-navy); border-color:var(--navy)}
.stepper{display:grid; grid-template-columns:52px 1fr 52px; gap:8px; max-width:240px}
.stepper button{min-height:48px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-size:24px; font-weight:600; line-height:1}
.stepper input{text-align:center; font-weight:700; font-size:18px}
details.more{border-top:1px solid var(--line); margin:4px -16px -16px; padding:0 16px}
details.more summary{list-style:none; cursor:pointer; padding:14px 0; display:flex; justify-content:space-between; gap:10px; align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary b{font-weight:600; white-space:nowrap}
details.more summary small{color:var(--muted); font-size:13px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
details.more[open] summary{padding-bottom:12px}
details.more .inner{padding-bottom:4px}

/* Autocompletar */
.auto{position:relative}
.sug{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:4; background:var(--surface); border:1.5px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 10px 24px rgba(16,24,40,.14)}
.sug button{display:block; width:100%; text-align:left; border:0; background:transparent; padding:12px 14px; min-height:46px; border-top:1px solid var(--line)}
.sug button:first-child{border-top:0}
.sug button:active,.sug button:hover{background:var(--navy-soft)}

/* Actividades */
.act{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin:0 0 12px; overflow:hidden}
.act > header{display:flex; gap:12px; align-items:flex-start; padding:14px 14px 10px}
.num{flex:none; width:30px; height:30px; border-radius:8px; background:var(--navy); color:var(--on-navy); display:grid; place-items:center; font:700 16px "Barlow Semi Condensed",sans-serif}
.act .t{min-width:0}
.act .t b{display:block; font:700 19px/1.2 "Barlow Semi Condensed",sans-serif}
.act .t small{color:var(--muted); font-size:13px}
.tags{display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 12px}
/* Etiqueta RF: el elemento memorable, como tarjeta de bloqueo */
.tag{display:inline-flex; align-items:stretch; border:2px solid var(--navy); border-radius:7px; background:var(--surface); padding:0; overflow:hidden; min-height:40px}
.tag b{display:grid; place-items:center; padding:0 9px; background:var(--navy); color:var(--on-navy); font:700 16px "Barlow Semi Condensed",sans-serif; letter-spacing:.02em; position:relative}
.tag b::before{content:""; position:absolute; left:4px; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:var(--surface)}
.tag b{padding-left:14px}
.tag span{display:grid; place-items:center; padding:0 10px; font-weight:600; font-size:14px; text-align:left}
.tag.edit{border-style:dashed; border-color:var(--muted); color:var(--muted); padding:0 12px; align-items:center; font-weight:600; font-size:14px}
.tag.need{border-color:var(--danger); color:var(--danger); border-style:solid; padding:0 12px; align-items:center; font-weight:700; background:var(--danger-soft)}
.prep{padding:10px 14px 12px; border-top:1px dashed var(--line)}
.prep .row{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
@media (min-width:560px){.prep .row{grid-template-columns:repeat(4,1fr)}}
.pp{min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--sunk); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 10px; text-align:left}
.pp i{font-style:normal; font:700 13px "Barlow Semi Condensed",sans-serif; padding:3px 8px; border-radius:6px; background:var(--navy); color:var(--on-navy)}
.pp.no{border-color:var(--danger); background:var(--danger-soft); color:var(--danger)}
.pp.no i{background:var(--danger); color:var(--surface)}
.warn{margin:8px 0 0; color:var(--danger); font-weight:600; font-size:14px}
.act details{border-top:1px solid var(--line)}
.act details summary{cursor:pointer; padding:12px 14px; color:var(--navy); font-weight:600; font-size:15px}
.rfd{padding:0 14px 8px}
.rfd div{padding:10px 0; border-top:1px solid var(--line); font-size:14px}
.rfd div:first-child{border-top:0}
.rfd h4{margin:0 0 4px; font:700 15px "Barlow Semi Condensed",sans-serif}
.rfd p{margin:2px 0}
.rfd em{font-style:normal; color:var(--muted)}
.act footer{display:flex; border-top:1px solid var(--line)}
.act footer button{flex:1; min-height:48px; border:0; background:transparent; font-weight:600; color:var(--navy)}
.act footer button + button{border-left:1px solid var(--line); color:var(--danger)}
.add{width:100%; min-height:64px; border:2px dashed var(--line); background:transparent; border-radius:14px; font:700 18px "Barlow Semi Condensed",sans-serif; color:var(--navy)}
.ghost{min-height:40px; border:1.5px solid var(--navy); color:var(--navy); background:transparent; border-radius:10px; padding:6px 12px; font-weight:600; font-size:14px}
.ghost:disabled{opacity:.45; cursor:not-allowed}

/* Grilla RF del turno */
.rfgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px}
@media (max-width:380px){.rfgrid{grid-template-columns:1fr 1fr}}
.rfb{display:flex; gap:10px; align-items:center; text-align:left; min-height:52px; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 10px; font-size:13px; line-height:1.2}
.rfb .tx{display:flex; flex-direction:column; min-width:0}
.rfb b{font:700 16px "Barlow Semi Condensed",sans-serif}
.rfb .tx span{color:var(--muted)}
.rfb[aria-pressed="true"] .tx span{color:var(--ink)}
.rfb .bx{flex:none; width:20px; height:20px; border:2px solid var(--muted); border-radius:4px; display:grid; place-items:center}
.rfb[aria-pressed="true"]{border-color:var(--navy); background:var(--navy-soft)}
.rfb[aria-pressed="true"] .bx{background:var(--navy); border-color:var(--navy)}
.rfb[aria-pressed="true"] .bx::after{content:""; width:6px; height:11px; border:solid var(--on-navy); border-width:0 2.5px 2.5px 0; transform:translateY(-1px) rotate(45deg)}
.rfb.auto .bx{border-radius:50%}

/* Interruptor */
.switch{display:flex; align-items:center; justify-content:space-between; gap:14px; font-weight:600; font-size:17px; cursor:pointer}
.switch input{appearance:none; -webkit-appearance:none; flex:none; width:54px; height:32px; border-radius:999px; background:var(--line); position:relative; transition:background .15s; cursor:pointer}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--navy)}
.switch input:checked::after{transform:translateX(22px)}
.switch small{display:block; font-weight:400; color:var(--muted); font-size:14px}
.lastday h3{font-size:18px; margin:20px 0 10px}
.ap{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--sunk)}
.ap .row2 .fld{margin-bottom:0}
.ap textarea, .ap input{background:var(--surface)}
.ap > .fld{margin-bottom:10px}

/* Historial */
.hist{list-style:none; margin:0; padding:0}
.hist li{display:flex; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .info{flex:1; min-width:0}
.hist .info b{display:block; font:700 17px "Barlow Semi Condensed",sans-serif}
.hist .info small{color:var(--muted); font-size:14px}
.hist .cur{font-size:12px; font-weight:700; color:var(--orange); margin-left:6px}
.empty{color:var(--muted); margin:0}

/* Barra inferior */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; justify-content:center}
.bar > *{max-width:370px}
.btn{flex:1; min-height:52px; border-radius:12px; border:1.5px solid var(--navy); background:var(--surface); color:var(--navy); font:700 18px "Barlow Semi Condensed",sans-serif}
.btn.primary{background:var(--orange); border-color:var(--orange); color:var(--on-orange)}
.btn:disabled{opacity:.5}

/* Hojas (bottom sheets) */
#sheet{position:fixed; inset:0; z-index:20}
#sheet[hidden]{display:none}
.scrim{position:absolute; inset:0; background:rgba(8,12,22,.5)}
.panel{position:absolute; left:0; right:0; bottom:0; max-height:92%; max-width:760px; margin:0 auto; background:var(--surface); border-radius:18px 18px 0 0;
  display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0px); animation:up .18s ease-out}
.panel.full{top:env(safe-area-inset-top,0px); max-height:none; border-radius:0; max-width:none}
@keyframes up{from{transform:translateY(24px); opacity:.6}to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.switch input,.switch input::after{transition:none}}
.sh-head{display:flex; align-items:center; gap:10px; padding:14px 16px 10px}
.sh-head h2{flex:1; font-size:21px}
.icon{width:44px; height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-size:20px; line-height:1}
.sh-body{overflow:auto; padding:0 16px 16px; -webkit-overflow-scrolling:touch}
.sh-foot{padding:10px 16px 12px; border-top:1px solid var(--line); display:flex; gap:10px}
.areas{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 12px; scrollbar-width:none}
.areas::-webkit-scrollbar{display:none}
.areas .chip{flex:none; min-height:38px; padding:6px 12px; font-size:14px}
.res{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:transparent; padding:12px 2px; min-height:56px}
.res .nm{font-weight:600; font-size:16px}
.res .meta{font-size:13px; color:var(--muted)}
.res .meta b{color:var(--navy); font-weight:700; margin-right:6px}
.res.new{border:2px dashed var(--orange); border-radius:12px; padding:12px; margin:8px 0; color:var(--orange)}
.res.new .nm{color:var(--ink)}
.grp{font:700 14px "Barlow Semi Condensed",sans-serif; color:var(--muted); margin:14px 2px 4px}
.rfpick{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.rfpick button{position:relative; display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:2px; min-height:64px; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 10px}
.rfpick button b{font:700 17px "Barlow Semi Condensed",sans-serif}
.rfpick button span{font-size:13px; color:var(--muted); line-height:1.25}
.rfpick button[aria-pressed="true"]{border-color:var(--navy); background:var(--navy-soft); box-shadow:inset 0 0 0 1px var(--navy)}
.rfpick button em{position:absolute; top:8px; right:8px; font-style:normal; width:22px; height:22px; border-radius:50%; background:var(--navy); color:var(--on-navy); font:700 13px "Barlow",sans-serif; display:grid; place-items:center}
.pages{background:var(--sunk); flex:1; overflow:auto; padding:12px}
.pages canvas{display:block; margin:0 auto 12px; background:#fff; box-shadow:0 2px 10px rgba(16,24,40,.18)}
.pages .msg{color:var(--muted); text-align:center; padding:40px 12px}
.zoom{display:flex; align-items:center; gap:6px}
.zoom span{min-width:48px; text-align:center; font-weight:600; font-size:14px}
.prevopts{padding:0 16px 10px}
.prevopts .switch{font-size:15px}
.prevopts .switch input{width:46px; height:28px}
.prevopts .switch input::after{width:22px; height:22px}
.prevopts .switch input:checked::after{transform:translateX(18px)}
.confirm p{margin:0 0 6px}

#toast{position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(10px); z-index:30;
  background:var(--ink); color:var(--surface); padding:12px 16px; border-radius:12px; font-weight:600; font-size:15px; max-width:calc(100% - 32px);
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s}
#toast.on{opacity:1; transform:translateX(-50%)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---- Nube, ingreso y panel de edición ---- */
.status{font-size:13px; color:var(--muted); margin:2px 4px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.status .dot{width:8px; height:8px; border-radius:50%; background:#16794A; flex:none}
.status.off .dot{background:#B54708}
.readonly{background:var(--sunk); border:1.5px dashed var(--line); border-radius:10px; padding:10px 12px; min-height:48px; display:flex; align-items:center; color:var(--ink)}
.readonly.empty{color:var(--muted)}
.badge{display:inline-block; font:700 12px "Barlow",sans-serif; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:2px}
.badge.ok{background:#E3F1EA; color:#16794A}
.badge.wait{background:#FEF0E6; color:#B54708}
.banner{border:1.5px solid var(--orange); background:#FFF4ED; border-radius:12px; padding:12px; margin:0 0 12px; display:flex; gap:10px; align-items:center; justify-content:space-between}
.banner p{margin:0; font-size:14px}
.admin{display:flex; align-items:center; justify-content:space-between; gap:10px}
.admin p{margin:0; color:var(--muted); font-size:14px}
.login p{margin:0 0 12px; color:var(--muted)}
.login input{margin-bottom:12px}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 12px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none; min-height:40px}
.who{margin:0 16px 8px; font-size:14px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px}
.who button{border:0; background:transparent; color:var(--navy); font-weight:600; min-height:36px}
.erow{display:flex; flex-direction:column; align-items:flex-start; gap:3px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:transparent; padding:12px 2px; min-height:56px}
.erow b{font-weight:700; font-size:16px}
.erow small{color:var(--muted); font-size:13px}
.erow.off{opacity:.55}
.back{border:0; background:transparent; color:var(--navy); font-weight:600; min-height:40px; padding:0; margin:0 0 6px}
.fit{display:block; font-size:13px; margin-top:6px; font-weight:600}
.fit.ok{color:#16794A}
.fit.warn{color:#B54708}
.fit.bad{color:var(--danger)}
.fixed-name{font:700 19px "Barlow Semi Condensed",sans-serif; margin:0 0 4px}
.note{font-size:13px; color:var(--muted); margin:0 0 14px}
.supl{list-style:none; margin:0 0 12px; padding:0}
.supl li{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line)}
.supl li:first-child{border-top:0}
.supl li span{flex:1; font-weight:600}
.supl li button{width:40px; height:40px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-size:16px}
.addrow{display:grid; grid-template-columns:1fr auto; gap:8px}
.addrow .ghost{min-height:48px}
.chg{border-top:1px solid var(--line); padding:12px 0}
.chg:first-child{border-top:0}
.chg b{display:block; font-size:15px}
.chg small{color:var(--muted)}
.chg details summary{cursor:pointer; color:var(--navy); font-weight:600; font-size:14px; padding:6px 0}
.diff{font-size:13px; margin:6px 0}
.diff .old{background:#FDECEA; color:#7A271A; padding:6px 8px; border-radius:8px; margin:4px 0}
.diff .new{background:#E3F1EA; color:#0F5132; padding:6px 8px; border-radius:8px; margin:4px 0}
.selbox{width:100%; min-height:48px; border:1.5px solid var(--line); background:var(--sunk); border-radius:10px; padding:10px 12px; font-size:16px}
/* ---- Nuevo formato: SÍ/NO/NA y textos por RF ---- */
.prep3{display:grid; gap:8px}
@media (min-width:560px){.prep3{grid-template-columns:1fr 1fr}}
.pr{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:6px 6px 6px 10px; background:var(--sunk)}
.pr > span{font-weight:600; font-size:14px}
.seg.sm{padding:2px; gap:2px; border-radius:9px; flex:none; background:var(--surface)}
.seg.sm button{min-height:38px; min-width:44px; flex:none; font-size:14px; border-radius:7px; padding:0 6px}
.seg.sm button.isno[aria-pressed="true"]{background:var(--danger); color:#fff}
.badge.mine{background:#FEF0E6; color:#B54708}
.ghost.sm{min-height:36px; padding:4px 10px; font-size:13px; margin-top:6px}
.act details summary{display:flex; align-items:center; justify-content:space-between; gap:8px}
.count{white-space:nowrap}
.dlopts{display:grid; gap:10px}
.taphint{margin:0 16px 8px; font-size:14px; color:var(--muted)}
canvas.tappable{cursor:pointer}
.sh-body > .card > h2:first-child{display:none} .sh-body > .card{border:0; padding:0}

/* ================= Menú, pasos y listas (versión con menú) ================= */
:root{ --faena:#14284A; --ok:#1E7B4B; --okbg:#E5F3EB; --amb:#8F5300; --ambbg:#FCF1DC }
.ic{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:middle}
.ic.s{width:16px; height:16px}
.ic.l{width:28px; height:28px; stroke-width:1.6}
.linkbtn{border:0; background:transparent; padding:0; color:var(--navy); font-weight:600; font-size:14px; text-decoration:underline; text-underline-offset:3px; min-height:32px}

/* Barra superior */
.top{min-height:60px}
.top .ttl h1{font-size:18px}
.tbtn{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--navy); font-weight:600; font-size:14px; flex:none}
.tbtn.back{border:0; padding:0 4px 0 0; color:var(--faena); margin:0}
.top .tbtn.back + .ttl{border-left:0; padding-left:0}

/* Menú inferior */
.bar[hidden]{display:none}
.tabbar{padding:0 0 env(safe-area-inset-bottom,0px); gap:0}
.tabbar button{flex:1; max-width:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:62px; border:0; background:transparent; color:#7D8899; font-weight:600; font-size:12.5px; position:relative}
.tabbar button[aria-current="page"]{color:var(--navy)}
.tabbar button[aria-current="page"]::before{content:""; position:absolute; top:-1px; left:50%; width:36px; margin-left:-18px; height:3px; border-radius:0 0 3px 3px; background:var(--orange)}
.tabbar .ic{width:22px; height:22px}

/* Inicio */
.hello{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin:4px 4px 2px}
.hello small{display:block; color:var(--muted); font-size:13px}
.hello b{display:block; font:700 25px/1.1 "Barlow Semi Condensed",sans-serif; color:var(--faena)}
.status .ic{color:#16794A}
.status.off .ic{color:#B54708}
.shift{display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; width:100%; text-align:left; border:0; border-radius:16px; padding:16px 16px 14px; margin:2px 0 20px; background:var(--orange); color:#fff}
.shift .d{font:700 40px/.95 "Barlow Semi Condensed",sans-serif; letter-spacing:-.01em}
.shift .m{grid-column:1; font-size:14px; opacity:.92}
.shift .go{grid-row:1/3; grid-column:2; width:52px; height:52px; border-radius:50%; background:#fff; color:var(--orange); display:grid; place-items:center}
.shift .go .ic{width:26px; height:26px; stroke-width:2.2}
.shift .cta{grid-column:1/3; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.4); font-weight:700; font-size:17px}
.sect{display:flex; justify-content:space-between; align-items:baseline; font-size:16px; margin:0 4px 6px; color:var(--faena)}
.sect small,.day small{font:500 13px "Barlow",sans-serif; color:var(--muted)}
.list{border-top:1px solid var(--line); margin:0 0 18px}
.li{display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:transparent; padding:11px 4px; min-height:60px; color:inherit}
.li:disabled{opacity:.5}
.li .ico{width:40px; height:40px; border-radius:10px; background:var(--sunk); color:var(--navy); display:grid; place-items:center; flex:none}
.li .in{flex:1; min-width:0}
.li .in b{display:block; font-weight:600; font-size:15.5px}
.li .in small{display:block; color:var(--muted); font-size:13px; margin-top:1px}
.li .chev{color:#A9B3C2}
.li.danger .ico{background:var(--danger-soft); color:var(--danger)}
.li.danger b{color:var(--danger)}
.pill{flex:none; background:var(--navy); color:#fff; border-radius:9px; padding:7px 13px; font-weight:600; font-size:14px}
.av{width:40px; height:40px; border-radius:50%; background:var(--sunk); color:var(--navy); font:700 15px "Barlow Semi Condensed",sans-serif; display:grid; place-items:center; flex:none}
.tgs{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px}
.tg{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; border-radius:6px; padding:2px 7px; background:var(--sunk); color:var(--faena); flex:none}
.tg .ic{width:12px; height:12px; stroke-width:2.2}
.tg.ok{background:var(--okbg); color:var(--ok)}
.tg.amb{background:var(--ambbg); color:var(--amb)}
.nums{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.nums > *{padding:10px 12px; text-align:left; border:0; background:transparent; color:inherit; display:flex; flex-direction:column; justify-content:flex-start}
.nums > * + *{border-left:1px solid var(--line)}
.nums b{display:block; font:700 26px/1.1 "Barlow Semi Condensed",sans-serif; color:var(--faena)}
.nums small{color:var(--muted); font-size:12.5px; line-height:1.2; display:block}

/* Mis RIT y Equipo */
.folder{display:flex; gap:12px; align-items:center; margin:4px 4px 14px}
.folder .ico{width:44px; height:44px; border-radius:12px; background:var(--navy); color:#fff; display:grid; place-items:center; flex:none}
.folder b{display:block; font:700 22px/1.1 "Barlow Semi Condensed",sans-serif; color:var(--faena)}
.folder small{color:var(--muted); font-size:13px}
.v-mis > .seg{margin-bottom:4px}
.day{display:flex; justify-content:space-between; align-items:baseline; font-size:16px; margin:16px 4px 4px; color:var(--faena)}
.search{display:flex; gap:8px; align-items:center; border:1.5px solid var(--line); background:var(--sunk); border-radius:10px; padding:0 12px; color:#7D8899; margin:2px 0 4px}
.search input{border:0 !important; background:transparent !important; min-height:46px; padding:0; box-shadow:none !important; flex:1}
.morebtn{display:flex; gap:6px; align-items:center; border:0; background:transparent; color:var(--navy); font-weight:600; font-size:14px; padding:6px 4px 12px; min-height:40px}
.emptybox{text-align:center; color:var(--muted); padding:30px 16px; border:1.5px dashed var(--line); border-radius:14px; margin:12px 0}
.emptybox .ic{color:#A9B3C2}
.emptybox p{margin:8px 0 12px}
.note.center{text-align:center; margin-top:14px}

/* Pasos del formulario */
.save{display:flex; gap:6px; align-items:center; color:var(--ok); font-weight:600; font-size:13px; margin:0 4px 10px}
.steps{display:flex; gap:4px; margin:0 0 16px; position:sticky; top:calc(60px + env(safe-area-inset-top,0px)); z-index:3; background:var(--surface); padding-top:4px}
.steps button{flex:1; min-width:0; border:0; border-top:3px solid var(--line); background:transparent; padding:8px 0 6px; font-weight:600; font-size:12.5px; color:#7D8899; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.steps button.ok{color:var(--ok); border-color:var(--ok)}
.steps button.on{color:var(--faena); border-color:var(--orange)}
.add{display:flex; gap:8px; align-items:center; justify-content:center}
.shared dl{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin:0 0 10px}
.shared dl .w{grid-column:1/3}
.shared dt{font-size:13px; color:var(--muted); font-weight:600}
.shared dd{margin:2px 0 0; font-weight:600}
.todo{list-style:none; margin:0 0 14px; padding:0}
.todo li{display:flex; gap:8px; align-items:center; color:var(--danger); font-weight:600; font-size:14px; padding:4px 0}
.okline{display:flex; gap:8px; align-items:center; color:var(--ok); font-weight:600; margin:0 0 14px}
.dlopts .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px}
.dlopts .row2{gap:10px}

/* ¿Quién eres? */
.gate{padding:20px 4px 0}
.gate .badge{width:56px; height:56px; border-radius:16px; background:var(--sunk); color:var(--navy); display:grid; place-items:center; margin:0 0 14px; padding:0}
.gate h2{font-size:26px; color:var(--faena)}
.gate > p{color:var(--muted); margin:6px 0 16px}
.gate .chips{margin-bottom:16px}
.btn.navy{width:100%; background:var(--navy); border-color:var(--navy); color:#fff}

/* Vista previa de solo lectura */
.pvt{flex:1; min-width:0}
.pvt h2{font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pvt p{margin:0; font-size:13px; color:var(--muted)}
.sh-head .icon{display:grid; place-items:center}
.ro{display:flex; gap:8px; align-items:center; background:var(--ambbg); color:var(--amb); font-weight:600; font-size:14px; padding:9px 16px; margin:0 0 10px}
.sh-foot .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px}

/* Panel de administración */
.who button{display:inline-flex; gap:6px; align-items:center}
.tiles{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.tiles button{display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:2px; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:transparent; padding:14px 13px; color:var(--navy); min-height:92px}
.tiles button:nth-child(2n){border-right:0}
.tiles button:nth-last-child(-n+2){border-bottom:0}
.tiles b{color:var(--faena); font-weight:600; font-size:15px; margin-top:8px}
.tiles small{color:var(--muted); font-size:12.5px}
.li.static{cursor:default}
.weeknav{display:flex; align-items:center; gap:10px; margin:0 0 12px}
.weeknav > div{flex:1; text-align:center}
.weeknav b{display:block; font:700 18px "Barlow Semi Condensed",sans-serif; color:var(--faena)}
.weeknav small{color:var(--muted); font-size:13px}
.weeknav .icon:disabled{opacity:.35}

.gate input[type=password], .login input[type=password]{width:100%; min-height:48px; border:1.5px solid var(--line); background:var(--sunk); border-radius:10px; padding:10px 12px; font-size:16px}

/* ================= OT por área ================= */
.otintro{background:var(--sunk); border-color:transparent}
.otintro h2{margin-bottom:6px}
.otcard{padding:14px 14px 6px}
.othead{display:flex; gap:12px; align-items:center; margin:0 0 14px}
.othead > div{flex:1; min-width:0}
.othead b{display:block; font:700 19px/1.15 "Barlow Semi Condensed",sans-serif; color:var(--faena)}
.othead small{color:var(--muted); font-size:13px}
.othead .ghost.sm{margin:0; display:inline-flex; gap:5px; align-items:center}
.otn{flex:none; display:grid; place-items:center; min-width:52px; height:44px; padding:0 8px; border-radius:10px; background:var(--orange); color:#fff; font:700 17px "Barlow Semi Condensed",sans-serif}
.ico.otn.sm{min-width:40px; width:40px; height:40px; font-size:16px; padding:0}
.otacts{list-style:none; margin:4px -14px 0; padding:0; border-top:1px solid var(--line)}
.otacts li + li{border-top:1px solid var(--line)}
.otacts button{display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:11px 14px; min-height:58px; color:inherit}
.otacts .num{width:28px; height:28px; font-size:15px}
.otacts .in{flex:1; min-width:0}
.otacts .in b{display:block; font-weight:600; font-size:15px}
.otacts .in small{display:block; color:var(--muted); font-size:13px}
.otacts .mv{flex:none; display:inline-flex; gap:5px; align-items:center; color:var(--navy); font-weight:600; font-size:13px; border:1.5px solid var(--line); border-radius:9px; padding:6px 9px}
.tiles button:last-child:nth-child(odd){grid-column:1/3; border-right:0}
</style>
</head>

function ritSan(s){
  return String(s == null ? "" : s).normalize("NFC").replace(/[\r\n\t]+/g, " ").replace(/[\u02BC]/g, "'")
    .replace(/[^\x20-\x7E\xA0-\xFF\u2013\u2014\u2022\u2026\u20AC\u2018\u2019\u201C\u201D]/g, "").replace(/\s+/g, " ").trim();
}
function ritWrap(text, font, size, maxW){
  const words = text.split(" "), lines = []; let cur = "";
  for (let w of words) {
    while (font.widthOfTextAtSize(w, size) > maxW && w.length > 1) {
      let k = w.length; while (k > 1 && font.widthOfTextAtSize(w.slice(0, k), size) > maxW) k--;
      if (cur) { lines.push(cur); cur = ""; }
      lines.push(w.slice(0, k)); w = w.slice(k);
    }
    const cand = cur ? cur + " " + w : w;
    if (font.widthOfTextAtSize(cand, size) <= maxW) cur = cand; else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
function ritFit(text, font, maxW, maxH, size, min, lead){
  lead = lead || 1.16;
  for (let s = size; s >= min - 0.001; s -= 0.2) { const lines = ritWrap(text, font, s, maxW); if (lines.length * s * lead <= maxH) return { s, lines, lead, cut:false }; }
  const s = min; let lines = ritWrap(text, font, s, maxW); let cut = false;
  const maxLines = Math.max(1, Math.floor((maxH + 1) / (s * lead)));
  if (lines.length > maxLines) {
    cut = true; lines = lines.slice(0, maxLines); let last = lines[maxLines - 1];

    lines[maxLines - 1] = last.replace(/\s+$/, "") + "…";
  }
  return { s, lines, lead, cut };
}

<script>
(function(){
"use strict";
// ================= Configuración =================
const RC = window.RIT_CONFIG || {};
const SB_URL = String(RC.SUPABASE_URL || "").replace(/\/+$/, "");
const SB_KEY = String(RC.SUPABASE_ANON_KEY || "");
const CLOUD = !!(SB_URL && SB_KEY && !/TU-PROYECTO|TU-ANON/.test(SB_URL + SB_KEY));
const LS_KEY = "rit_rt_v3", CAT_KEY = "rit_cat_v2";
const PREP_V = [["SI","SÍ"],["NO","NO"]];   // el formato naranjo solo tiene SÍ y NO
const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = String(iso).split("-"); return d + "-" + m + "-" + y; };
const ITEMS = ["Instructivos y/o PTS","Materiales","Herramientas","EPP"];

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const short = iso => iso ? iso.slice(8,10) + "-" + iso.slice(5,7) : "";
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[-_/]/g, "");
const ordOf = c => { const m = /^(\d+)\.(\d+)$/.exec(c); return m ? (+m[1]) * 1000 + (+m[2]) : 999000; };
const stamp = t => { if (!t) return ""; const d = new Date(t); return String(d.getDate()).padStart(2,"0") + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + d.getFullYear() + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };

// ================= Supabase (REST) =================
function sbHeaders(json){ const h = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }; if (json) h["Content-Type"] = "application/json"; return h; }
async function sbGet(path){
  const r = await fetch(SB_URL + "/rest/v1/" + path, { headers: sbHeaders(), cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function rpc(fn, body){
  let r;
  try { r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: sbHeaders(true), body: JSON.stringify(body || {}) }); }
  catch (e) { const er = new Error("Sin conexión"); er.offline = true; throw er; }
  const t = await r.text();
  if (!r.ok) { let m = t; try { const j = JSON.parse(t); m = j.message || j.error || t; } catch (e) {} const er = new Error(m || ("HTTP " + r.status)); er.status = r.status; er.badKey = /Clave incorrecta/.test(m); throw er; }
  return t ? JSON.parse(t) : null;
}

// ================= Catálogo oficial =================
function defaultCatalog(){
  return {
    at: 0,
    rf: RF_ORDER.map((c, i) => ({ code:c, nombre:RF_LIB[c].n, riesgo:RF_LIB[c].r, cons_tipo:RF_LIB[c].t, consecuencia:RF_LIB[c].c, controles:RF_LIB[c].k, orden:i + 1 })),
    acts: CAT.map(([c, n, p]) => ({ code:c, area:AREAS[c.split(".")[0]], nombre:n, rf:PKG[p].slice(), activo:true, orden:ordOf(c) })),
    sup: SUPERVISORES.slice(),
    cfg: { gerencia:"Planta", superint:"CHM.M", eecc:"Mantenimiento Industrial SpA", contrato:"4600031622", nombreContrato:"Servicio de Aseo Industrial en Áreas Operacionales DRT", jefeOps:"Bastián Araya Villavicencio" }
  };
}
let KC = (() => { try { const o = JSON.parse(localStorage.getItem(CAT_KEY)); if (o && o.rf && o.acts) return o; } catch (e) {} return defaultCatalog(); })();
let RFL = {}, RFO = [], ACT = {}, AREA_LIST = [];
function indexCatalog(){
  RFL = {}; KC.rf.forEach(r => { RFL[r.code] = { n:r.nombre, r:r.riesgo, t:r.cons_tipo || "", c:r.consecuencia, k:r.controles, by:r.updated_by, at:r.updated_at }; });
  RFO = KC.rf.slice().sort((a, b) => a.orden - b.orden).map(r => r.code).filter(c => RIT3.CODES.includes(c));
  ACT = {}; KC.acts.forEach(a => { ACT[a.code] = a; });
  AREA_LIST = []; KC.acts.slice().sort((a, b) => a.orden - b.orden).forEach(a => { if (!AREA_LIST.includes(a.area)) AREA_LIST.push(a.area); });
}
indexCatalog();
let catState = CLOUD ? "cargando" : "local";
async function refreshCatalog(silent){
  if (!CLOUD) return false;
  try {
    const [rf, acts, sup, cfg] = await Promise.all([
      sbGet("rit_rf?select=*&order=orden"), sbGet("rit_actividades?select=*&order=orden"),
      sbGet("rit_supervisores?select=nombre&order=orden"), sbGet("rit_config?select=k,v")
    ]);
    if (!rf.length) throw new Error("vacío");
    const c = cfg.find(x => x.k === "contrato");
    KC = { at: Date.now(), rf, acts, sup: sup.map(s => s.nombre), cfg: c ? c.v : KC.cfg };
    try { localStorage.setItem(CAT_KEY, JSON.stringify(KC)); } catch (e) {}
    indexCatalog(); catState = "ok"; syncDraftWithCatalog();
    if (!silent && sheet.hidden) render(); else if (!silent) renderStatus();
    return true;
  } catch (e) { catState = "off"; renderStatus(); return false; }
}
// Las actividades de hoy que no se editaron a mano toman el nombre y los RF vigentes del catálogo
function syncDraftWithCatalog(){
  let changed = false;
  D().acts.forEach(a => { const c = ACT[a.id]; if (c && !a.manualRf) { if (a.rf.join() !== c.rf.join() || a.name !== c.nombre) { a.rf = c.rf.slice(); a.name = c.nombre; changed = true; } } });
  if (changed) persist(true);
}

// ================= Estado del usuario =================
function blankMem(){ return { names:[], supOtros:[], areaEsp:[], custom:[], use:{}, hist:[], outbox:{}, team:"", teamWho:"", yo:"", myTexts:{}, myDef:{} }; }
function guessJornada(){ const h = new Date().getHours(); return h >= 6 && h < 18 ? "Día" : "Noche"; }
function blankDraft(prev){
  return { id:"r" + Date.now() + Math.random().toString(36).slice(2, 6),
    h:{ fecha:today(), turno: prev ? prev.h.turno : "A", area: prev ? prev.h.area : "Área Seca", supervisor: prev ? prev.h.supervisor : "", asistentes: prev ? prev.h.asistentes : 0, jornada: guessJornada() },
    ot:{ areaEsp: prev && prev.ot ? prev.ot.areaEsp : "", tipo: prev && prev.ot ? prev.ot.tipo : "" },
    acts:[], rfAdd:[], lastDay:false,
    aportes:[0,1,2,3].map(() => ({ p:"", r:"", f:today() })), recon:[0,1,2,3].map(() => ({ q:"", m:"" })) };
}
let S = (() => { try { const o = JSON.parse(localStorage.getItem(LS_KEY)); if (o && o.draft && o.mem) { o.mem = Object.assign(blankMem(), o.mem); o.draft.ot = o.draft.ot || { areaEsp:"", tipo:"" }; return o; } } catch (e) {} return { draft: blankDraft(null), mem: blankMem(), updatedAt: 0 }; })();
const mem = () => S.mem, D = () => S.draft;
// Borrador nuevo: el supervisor sale del "¿Quién eres?" de este celular
function newDraft(prev){ const d = blankDraft(prev); if (mem().yo) d.h.supervisor = mem().yo; return d; }
if (!D().h.supervisor && mem().yo) D().h.supervisor = mem().yo;
let saveTimer = null;
function persist(now){
  S.updatedAt = Date.now(); clearTimeout(saveTimer);
  const run = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} };
  if (now) run(); else saveTimer = setTimeout(run, 300);
  scheduleDraftSync();
}

// ================= Catálogo: búsqueda =================
function itemById(id){
  if (ACT[id]) return { id, name:ACT[id].nombre, area:ACT[id].area, rf:ACT[id].rf, activo:ACT[id].activo };
  const c = mem().custom.find(x => x.id === id);
  return c ? { id:c.id, name:c.name, area:"Mis actividades", custom:true, rf:c.rf, activo:true } : null;
}
function allItems(){
  return mem().custom.map(c => ({ id:c.id, name:c.name, area:"Mis actividades", custom:true, rf:c.rf }))
    .concat(KC.acts.filter(a => a.activo).sort((a, b) => a.orden - b.orden).map(a => ({ id:a.code, name:a.nombre, area:a.area, rf:a.rf })));
}
function search(q, area){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  let list = allItems();
  if (area === "frecuentes") list = list.filter(x => mem().use[x.id]);
  else if (area === "mias") list = list.filter(x => x.custom);
  else if (area && area !== "todas") list = list.filter(x => !x.custom && x.area === area);
  if (toks.length) list = list.filter(x => { const hay = norm(x.name + " " + x.id + " " + x.area); return toks.every(t => hay.includes(t)); });
  if (toks.length || area === "frecuentes") { const u = mem().use; list = list.slice().sort((a, b) => (u[b.id] || 0) - (u[a.id] || 0)); }
  return list;
}
// Texto vigente de un RF dentro de una actividad: lo editado hoy, si no la versión propia por defecto, si no el oficial
function txt(a, code){
  const L = RFL[code] || { r:"", t:"", c:"", k:"" }, o = a.ov && a.ov[code];
  if (o === "OF") return { r:L.r, t:L.t, c:L.c, k:L.k, src:"of" };
  if (o) return Object.assign({}, o, { src:"edit" });
  const dflt = mem().myDef[code]; if (dflt) return Object.assign({}, dflt, { src:"mine" });
  return { r:L.r, t:L.t, c:L.c, k:L.k, src:"of" };
}
const sameTxt = (x, y) => x && y && x.r === y.r && x.t === y.t && x.c === y.c && x.k === y.k;
function autoMarks(d){ const s = new Set(); d.acts.forEach(a => (a.rf || []).forEach(c => s.add(c))); return s; }

// ================= Aprendizaje e historial =================
function learn(key, v){
  v = String(v || "").trim(); if (!v) return;
  const arr = key === "names" ? mem().names : key === "areaEsp" ? mem().areaEsp : mem().supOtros;
  if (key === "supervisor" && KC.sup.some(s => norm(s) === norm(v))) return;
  const i = arr.findIndex(x => norm(x) === norm(v)); if (i >= 0) arr.splice(i, 1);
  arr.unshift(v); if (arr.length > 80) arr.length = 80;
}
function learnAll(d){ learn("supervisor", d.h.supervisor); if (d.ot) learn("areaEsp", d.ot.areaEsp); if (d.lastDay) { d.aportes.forEach(a => learn("names", a.r)); d.recon.forEach(r => learn("names", r.q)); } }
function upsertHist(entry){
  const h = mem().hist; const i = h.findIndex(e => e.id === entry.id);
  if (i >= 0) h.splice(i, 1, entry); else h.push(entry);
  h.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || b.at - a.at);
  if (h.length > 60) h.length = 60;
}
function archive(d, countUse, estado){
  if (!d.acts.length) return;
  const old = mem().hist.find(e => e.id === d.id);
  const est = estado === "terminado" || (old && old.estado === "terminado") ? "terminado" : "borrador";
  upsertHist({ id:d.id, fecha:d.h.fecha, turno:d.h.turno, sup:d.h.supervisor, area:d.h.area, jornada:d.h.jornada, n:d.acts.length, at:Date.now(), d:clone(d), cloud:false, estado:est });
  if (countUse) d.acts.forEach(a => { mem().use[a.id] = (mem().use[a.id] || 0) + 1; });
  learnAll(d);
  if (CLOUD) { mem().outbox[d.id] = 1; flushOutbox(); }
}
function previous(){ return mem().hist.find(e => e.id !== D().id) || null; }
if (D().h.fecha !== today()) { archive(D(), false); S.draft = newDraft(D()); persist(true); }

let cloudBusy = false, NEW_API = true;
const cloudKey = () => mem().team || (ED && ED.key) || "";
const isMissingFn = e => e && (e.status === 404 || /could not find the function|PGRST202/i.test(e.message || ""));
// Copia que se sube: incluye los textos de cada RF tal como salen en el PDF de este supervisor
function cloudData(d){
  const c = clone(d); c.acts.forEach(a => { delete a._open; });
  c.tx = d.acts.map(a => { const o = {}; (a.rf || []).filter(x => RFL[x]).forEach(x => { const T = txt(a, x); o[x] = { r:T.r, t:T.t, c:T.c, k:T.k }; }); return o; });
  return c;
}
async function saveRec(id, fecha, turno, sup, estado, data){
  const k = cloudKey();
  if (NEW_API) {
    try { await rpc("rit_registro_guardar2", { p_clave:k, p_id:id, p_fecha:fecha, p_turno:turno, p_supervisor:sup || "", p_estado:estado, p_data:data }); return true; }
    catch (e) { if (!isMissingFn(e)) throw e; NEW_API = false; }
  }
  if (estado !== "terminado") return false;          // sin la actualización de la base, los borradores no se suben
  await rpc("rit_registro_guardar", { p_clave:k, p_id:id, p_fecha:fecha, p_turno:turno, p_supervisor:sup || "", p_data:data });
  return true;
}
async function flushOutbox(){
  if (!CLOUD || !mem().team || cloudBusy) return;
  cloudBusy = true;
  try {
    for (const id of Object.keys(mem().outbox)) {
      const e = mem().hist.find(x => x.id === id); if (!e) { delete mem().outbox[id]; continue; }
      const ok = await saveRec(e.id, e.fecha, e.turno, e.sup, e.estado || "terminado", cloudData(e.d));
      delete mem().outbox[id]; if (ok) e.cloud = true;
    }
    persist(true); SUM.at = 0;
  } catch (e) { if (e.badKey) { mem().team = ""; persist(true); } }
  cloudBusy = false; if (sheet.hidden) render();
}
// Borrador en la nube: se sube solo unos segundos después del último cambio
let draftTimer = null, draftSig = "", draftState = "";
function scheduleDraftSync(){
  if (!CLOUD || !mem().team || !NEW_API) return;
  clearTimeout(draftTimer); draftTimer = setTimeout(syncDraft, 3500);
}
async function syncDraft(){
  const d = D(); if (!d.acts.length || !mem().team || !NEW_API) return;
  const data = cloudData(d), sig = JSON.stringify(data); if (sig === draftSig) return;
  const old = mem().hist.find(e => e.id === d.id), est = old && old.estado === "terminado" ? "terminado" : "borrador";
  try { draftState = "subiendo"; const ok = await saveRec(d.id, d.h.fecha, d.h.turno, d.h.supervisor, est, data); draftSig = sig; draftState = ok ? "nube" : ""; SUM.at = 0; }
  catch (e) { draftState = e.offline ? "sinred" : ""; if (e.badKey) { mem().team = ""; persist(true); } }
  const el = $("#savestate"); if (el) el.outerHTML = saveStateHtml();
}
// Resumen de los RIT en la nube (para Inicio, Mis RIT, Equipo y el panel)
const SUM = { from:null, rows:[], at:0, loading:false, err:"" };
async function loadSum(fromIso, force){
  if (!CLOUD || !cloudKey() || !NEW_API) return SUM.rows;
  const need = force || !SUM.at || Date.now() - SUM.at > 60000 || (fromIso === null ? SUM.from !== null : SUM.from !== null && fromIso < SUM.from);
  if (!need || SUM.loading) return SUM.rows;
  SUM.loading = true;
  try {
    const rows = await rpc("rit_registros_resumen", { p_clave:cloudKey(), p_desde:fromIso, p_hasta:null, p_limit:fromIso === null ? 1000 : 600 });
    SUM.rows = rows || []; SUM.from = fromIso; SUM.at = Date.now(); SUM.err = "";
  } catch (e) {
    if (isMissingFn(e)) { NEW_API = false; SUM.err = "update"; }
    else SUM.err = e.offline ? "offline" : (e.message || "error");
    if (e.badKey) { mem().team = ""; persist(true); }
  }
  SUM.loading = false; if (sheet.hidden) render(); else if (panel.dataset.kind === "ed") drawEditor();
  return SUM.rows;
}
const DOCS = {};   // documentos completos ya descargados, por id
async function fetchDocs(ids, key){
  const miss = ids.filter(id => !DOCS[id]);
  if (miss.length) { const rows = await rpc("rit_registros_ver", { p_clave:key || cloudKey(), p_ids:miss }); (rows || []).forEach(r => { DOCS[r.id] = r; }); }
  return ids.map(id => DOCS[id]).filter(Boolean);
}

const OT_OTRAS = "Otras actividades";
function actArea(a){ const it = itemById(a.id); return it && !it.custom ? it.area : ""; }
function autoGroup(a){ const ar = actArea(a); if (!ar) return OT_OTRAS; const g = (KC.cfg && KC.cfg.otGrupos) || {}; return String(g[ar] || "").trim() || ar; }
function otGroups(d){
  const map = new Map();
  d.acts.forEach((a, i) => { const key = a.ot || autoGroup(a); if (!map.has(key)) map.set(key, { key, acts:[] }); map.get(key).acts.push({ a, i }); });
  const list = [...map.values()], info = d.otInfo || {};
  list.forEach((g, n) => {
    const inf = info[g.key] || {};
    g.n = n + 1; g.manual = /^Nueva OT \d+$/.test(g.key);
    g.areaEsp = inf.areaEsp !== undefined ? inf.areaEsp : list.length === 1 && d.ot && d.ot.areaEsp ? d.ot.areaEsp : g.key === OT_OTRAS || g.manual ? "" : g.key;
    g.tipo = inf.tipo !== undefined ? inf.tipo : (d.ot || {}).tipo || "";
  });
  return list;
}

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const isoOf = dt => dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
const dateOf = iso => { const [y, m, d] = String(iso).split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const t = dateOf(iso); t.setDate(t.getDate() + n); return isoOf(t); };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const dShort = iso => { const t = dateOf(iso); return cap1(DIAS[t.getDay()].slice(0, 3)) + " " + t.getDate() + " " + MESES[t.getMonth()]; };
const dLong = iso => { const t = dateOf(iso); return DIAS[t.getDay()] + " " + t.getDate() + " " + MESES[t.getMonth()]; };
function dayLabel(iso){ const t = today(); if (iso === t) return "Hoy"; if (iso === addDays(t, -1)) return "Ayer"; return cap1(DIAS[dateOf(iso).getDay()]); }
// Semana de turno: de miércoles a martes
function weekStart(iso){ const t = dateOf(iso); return addDays(iso, -((t.getDay() - 3 + 7) % 7)); }
function weekLabel(ws){ const we = addDays(ws, 6), a = dateOf(ws), b = dateOf(we); return a.getMonth() === b.getMonth() ? `${a.getDate()} al ${b.getDate()} ${MESES[b.getMonth()]}` : `${a.getDate()} ${MESES[a.getMonth()]} al ${b.getDate()} ${MESES[b.getMonth()]}`; }
function ago(t){ if (!t) return ""; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "recién"; if (m < 60) return "hace " + m + " min"; const h = Math.round(m / 60); if (h < 24) return "hace " + h + " h"; return stamp(t); }
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(x => x.charAt(0)).join("").toUpperCase();
const sameName = (a, b) => !!a && !!b && norm(a).replace(/\s+/g, " ").trim() === norm(b).replace(/\s+/g, " ").trim();
const jor = j => String(j || "").toLowerCase();
const recTitle = r => [r.turno ? "Turno " + r.turno : "", jor(r.jornada), r.area].filter(Boolean).join(", ");

const STEPS = ["Turno", "Actividades", "Preparados", "OT", "Cierre"];

function sumFrom(){ if (VIEW === "mis" && MIS_F === "todo") return null; const t = today(); const a = addDays(t, -Math.max(EQ_DAYS - 1, 6)), b = VIEW === "mis" && MIS_F === "mes" ? t.slice(0, 8) + "01" : weekStart(t); return [a, b, SUM.from || a].sort()[0]; }

function tagsFor(r){

  return t;
}
function byDay(list, row){
  let h = "", last = null;
  list.forEach(r => {
    if (r.fecha !== last) { if (last !== null) h += `</div>`; const n = list.filter(x => x.fecha === r.fecha).length; h += `<h3 class="day">${dayLabel(r.fecha)}<small>${esc(dLong(r.fecha))}${row === "team" ? ", " + n + " RIT" : ""}</small></h3><div class="list">`; last = r.fecha; }

  });
  return h + (last !== null ? `</div>` : "");
}
function misRow(r){
  return `<button class="li" data-act="${r.current ? "goform" : "misitem"}" data-id="${esc(r.id)}"><span class="in"><b>${esc(recTitle(r))}</b><small>${r.n || 0} ${r.n === 1 ? "actividad" : "actividades"}</small><span class="tgs">${tagsFor(r)}</span></span>${r.current ? `<span class="pill">Seguir</span>` : ic("chev", "chev")}</button>`;

function equipoList(){
  const t = today(), from = addDays(t, -(EQ_DAYS - 1)), q = norm(EQ_Q).split(/\s+/).filter(Boolean);

  if (q.length) list = list.filter(r => { const hay = norm(r.supervisor + " " + r.actividades + " " + r.area); return q.every(x => hay.includes(x)); });
  if (!list.length) return `<div class="emptybox">${ic("team", "l")}<p>${q.length ? "Sin resultados para esa búsqueda." : "Todavía no hay RIT de otros supervisores en estos días."}</p></div>` + moreBtn();

}

function actCard(a, i, mode){

  const anyNo = a.prep.some(x => x === "NO");

async function drawPreview(){

    case "archwk": ADM.week = addDays(ADM.week || weekStart(today()), +el.dataset.d); drawEditor(); break;
    case "architem": { const id = el.dataset.id; const r = ADM.rows.find(x => x.id === id); try { toast("Abriendo…"); const [doc] = await fetchDocs([id], ED.key); if (!doc) { toast("No se encontró ese RIT."); break; }
        PV = { back:"ed", d:doc.data, id, own:false, title:doc.supervisor || "Sin supervisor", sub:dLong(doc.fecha) + ", " + recTitle(r || {}) }; previewDoc = "rit"; $("#toast").classList.remove("on"); openPreview(); }
      catch (er) { toast(er.offline ? "Sin conexión." : er.message); } break; }
    case "archzip": zipWeek(el); break;
    case "edback": edView = null; drawEditor(); break;
    case "edrf": edView = { rf: el.dataset.c }; drawEditor(); break;
    case "edsaverf": { const c = edView.rf; const ok = await edSave("rit_guardar_rf", { p_code:c, p_nombre:RFL[c].n, p_riesgo:$("#f_r").value, p_cons_tipo:$("#f_t").value, p_consecuencia:$("#f_c").value, p_controles:$("#f_k").value }, `RF${c} guardado: todos lo verán al abrir la app`); if (ok) { edView = null; drawEditor(); } break; }
    case "edact": edView = { act: el.dataset.c }; drawEditor(); break;
    case "edactrf": { const v = readActForm(); const c = el.dataset.c, k = v.rf.indexOf(c);
      if (k >= 0) v.rf.splice(k, 1); else if (v.rf.length >= 3) { toast("El formato admite 3 RF por actividad"); break; } else v.rf.push(c);
      const y = ($("#edbody") || {}).scrollTop || 0; drawEditor(); const b = $("#edbody"); if (b) b.scrollTop = y; break; }
    case "edsaveact": { const v = readActForm();
      if (!v.area) { toast("Escribe el nombre del área nueva"); break; }
      if (!v.code) { toast("Falta el código"); break; }
      if (v.nuevo && ACT[v.code]) { toast(`El código ${v.code} ya existe`); break; }
      if (!v.nombre.trim()) { toast("Falta el nombre de la actividad"); break; }
      const ok = await edSave("rit_guardar_actividad", { p_code:v.code, p_area:v.area, p_nombre:v.nombre, p_rf:v.rf, p_activo:v.activo }, "Actividad guardada: todos la verán al abrir la app");
      if (ok) { edView = null; drawEditor(); } break; }
    case "supadd": { const inp = $("#s_new"); const v = (inp.value || "").trim(); if (!v) break; if (!edView.sup.some(s => norm(s) === norm(v))) edView.sup.push(v); drawEditor(); break; }
    case "supdel": edView.sup.splice(+el.dataset.i, 1); drawEditor(); break;
    case "supup": { const i = +el.dataset.i; if (i > 0) { const t = edView.sup[i - 1]; edView.sup[i - 1] = edView.sup[i]; edView.sup[i] = t; } drawEditor(); break; }
    case "edsavesup": { const ok = await edSave("rit_guardar_supervisores", { p_lista:edView.sup }, "Lista de supervisores guardada"); if (ok) { edView = null; drawEditor(); } break; }
    case "edsaveotg": { const og = {}; AREA_LIST.forEach((a, i) => { const v = (($("#og_" + i) || {}).value || "").trim(); if (v && v !== a) og[a] = v; });
      const ok = await edSave("rit_guardar_config", { p_valor:Object.assign({}, KC.cfg, { otGrupos:og }) }, "Grupos de OT guardados: todos los verán al abrir la app"); if (ok) drawEditor(); break; }
    case "edsavecfg": { const v = Object.assign({}, KC.cfg); ["gerencia","superint","eecc","contrato","nombreContrato","jefeOps"].forEach(k => v[k] = ($("#c_" + k).value || "").trim());
      await edSave("rit_guardar_config", { p_valor:v }, "Datos del contrato guardados"); break; }
    case "restore": { const r = (window.__ritLog || [])[+el.dataset.idx]; if (!r || !r.antes) break; const a = r.antes; let ok;
      if (r.tabla === "rf") ok = await edSave("rit_guardar_rf", { p_code:a.code, p_nombre:a.nombre, p_riesgo:a.riesgo, p_cons_tipo:a.cons_tipo || "", p_consecuencia:a.consecuencia, p_controles:a.controles }, "Se restauró el texto anterior");
      else ok = await edSave("rit_guardar_actividad", { p_code:a.code, p_area:a.area, p_nombre:a.nombre, p_rf:a.rf, p_activo:a.activo }, "Se restauró la versión anterior");
      if (ok) loadLog(); break; }
    case "keysave": { const q = el.dataset.q, inp = $(q === "yo" ? "#k_yo" : "#k_equipo"), v = inp.value;
      if (v.length < 6) { toast("La clave debe tener al menos 6 caracteres"); break; }
      try { await rpc("rit_cambiar_clave", { p_clave:ED.key, p_quien:q, p_nueva:v }); inp.value = "";
        if (q === "yo") { ED.key = v; try { sessionStorage.setItem("rit_ed", JSON.stringify(ED)); } catch (er) {} }
        if (q === "equipo") { mem().team = v; persist(true); }
        toast(q === "yo" ? "Tu clave quedó cambiada" : "Clave del equipo cambiada: avísale al equipo");
      } catch (er) { toast(er.offline ? "Sin conexión." : er.message); } break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "lastday") { D().lastDay = el.checked; persist(true); rerender(); return; }
  if (el.dataset.act === "rev") { previewRev = el.checked; drawPreview(); return; }
  if (el.id === "f_t" || el.id === "x_t") { updateFits(); return; }
  if (el.id === "a_area") { const w = $("#a_newarea_w"); if (w) w.hidden = el.value !== "__nueva"; const v = edView && edView.draft; if (v && v.nuevo && el.value !== "__nueva") { const cd = $("#a_code"); if (cd) cd.value = nextCode(el.value); } return; }
  if (el.dataset.otarea !== undefined) { learn("areaEsp", el.value); persist(true); return; }
  if (el.dataset.bind) { if (el.dataset.auto) learn(el.dataset.auto, el.value); persist(true); if (el.dataset.rerender) render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.fit) { updateFits(); return; }
  if (el.dataset.otarea !== undefined) { otInfoOf(D(), el.dataset.otarea).areaEsp = el.value; persist(); showSug(el); return; }
  if (!el.dataset.bind) return;
  let v = el.value; if (el.dataset.num !== undefined) v = parseInt(v.replace(/\D/g, ""), 10) || 0;
  setPath(D(), el.dataset.bind, v); persist();
  if (el.dataset.auto) showSug(el);
});
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.auto) showSug(e.target); });
document.addEventListener("focusout", e => { if (e.target.dataset && e.target.dataset.auto) setTimeout(() => hideSug(e.target), 160); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
function showSug(inp){
  const key = inp.dataset.auto; const src = key === "names" ? mem().names : key === "areaEsp" ? mem().areaEsp : mem().supOtros;
  const q = norm(inp.value).trim(), toks = q.split(/\s+/).filter(Boolean);
  const list = src.filter(s => norm(s) !== q && toks.every(t => norm(s).includes(t))).slice(0, 6);
  hideSug(inp); if (!list.length) return;
  const box = document.createElement("div"); box.className = "sug";
  box.innerHTML = list.map(s => `<button type="button" data-v="${esc(s)}">${esc(s)}</button>`).join("");
  box.addEventListener("pointerdown", ev => { const b = ev.target.closest("button"); if (!b) return; ev.preventDefault();
    inp.value = b.dataset.v; if (inp.dataset.otarea !== undefined) otInfoOf(D(), inp.dataset.otarea).areaEsp = inp.value; else setPath(D(), inp.dataset.bind, inp.value); learn(key, inp.value); persist(true); hideSug(inp); if (inp.dataset.rerender) render(); else inp.blur(); });
  inp.parentNode.appendChild(box);
}
function hideSug(inp){ const p = inp.parentNode; if (p) p.querySelectorAll(".sug").forEach(x => x.remove()); }

// ================= Arranque =================
render();
if (CLOUD) {
  refreshCatalog(); flushOutbox(); loadSum(sumFrom());
  let lastCheck = Date.now();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastCheck > 30000) { lastCheck = Date.now(); refreshCatalog(!sheet.hidden); flushOutbox(); loadSum(sumFrom(), true); } });
  window.addEventListener("online", () => { refreshCatalog(!sheet.hidden); flushOutbox(); });
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();

</script>
